name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin in lockstep with ci.yml's GODOT_VERSION and project.godot's engine version.
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            preset: "Windows Desktop"
            out: build/windows
            check: build/windows/OverTheBrim.exe
            artifact: OverTheBrim-windows.zip
          - name: linux
            preset: "Linux"
            out: build/linux
            check: build/linux/OverTheBrim.x86_64
            artifact: OverTheBrim-linux.zip
          - name: macos
            preset: "macOS"
            out: build/macos
            check: build/macos/OverTheBrim.zip
            artifact: OverTheBrim-macos.zip
          - name: android
            preset: "Android"
            out: build/android
            check: build/android/OverTheBrim.apk
            artifact: OverTheBrim-android.zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore baked Godot config (Java/Android SDK, adb setting, templates)
        # GitHub Actions overrides HOME to an empty /github/home for
        # container jobs and ignores container.env.HOME (confirmed: the
        # runner's own `docker create -e HOME=/github/home` wins regardless
        # of what's set here) -- so this image's baked /root/.config/godot
        # (java_sdk_path, android_sdk_path) and
        # /root/.local/share/godot/export_templates are invisible. This
        # fixes Android's "valid Java SDK path" export error.
        #
        # Also flips the baked export/android/shutdown_adb_on_exit setting
        # to false, since the Android export plugin loads for every export
        # (an Android preset is configured) and otherwise tries to talk to
        # adb on shutdown, producing a "connection refused" warning with no
        # adb daemon running. This does NOT fix the separate SIGSEGV crash
        # every export hits right after savepack -- see the Export steps'
        # comments for that.
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot"
          GODOT_MINOR="${GODOT_VERSION%.*}"
          if [ -f "/root/.config/godot/editor_settings-$GODOT_MINOR.tres" ]; then
            sed 's#export/android/shutdown_adb_on_exit = true#export/android/shutdown_adb_on_exit = false#' \
              "/root/.config/godot/editor_settings-$GODOT_MINOR.tres" \
              > "$HOME/.config/godot/editor_settings-$GODOT_MINOR.tres"
          fi
          cp -r /root/.local/share/godot/export_templates "$HOME/.local/share/godot/" 2>/dev/null || true

      - name: Import project
        run: godot --headless --editor --quit

      - name: Ensure Godot export templates
        # Fallback only -- the step above already copies these from the
        # image's /root when present. Kept in case a future image tag stops
        # baking them there.
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          if [ -d "$TEMPLATE_DIR" ] && [ -n "$(ls -A "$TEMPLATE_DIR" 2>/dev/null)" ]; then
            echo "Export templates already present at $TEMPLATE_DIR"
            exit 0
          fi
          echo "Export templates missing at $TEMPLATE_DIR — downloading official ${{ env.GODOT_VERSION }} templates."
          command -v curl >/dev/null || (apt-get update && apt-get install -y curl)
          command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip)
          curl -fL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q /tmp/templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* "$TEMPLATE_DIR/"
          rm -rf /tmp/templates.tpz /tmp/templates_extract

      - name: Configure Android signing
        if: matrix.name == 'android'
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android_release.keystore
            sed -i "s#keystore/release=\"\"#keystore/release=\"$(pwd)/android_release.keystore\"#" export_presets.cfg
            sed -i "s#keystore/release_user=\"\"#keystore/release_user=\"${{ secrets.ANDROID_KEY_ALIAS }}\"#" export_presets.cfg
            sed -i "s#keystore/release_password=\"\"#keystore/release_password=\"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\"#" export_presets.cfg
            echo "EXPORT_MODE=--export-release" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — falling back to debug-signed APK (see docs/adr/ADR-007)."
            echo "EXPORT_MODE=--export-debug" >> "$GITHUB_ENV"
          fi

      - name: Export (desktop)
        if: matrix.name != 'android'
        # Godot 4.7.2 reliably crashes (SIGSEGV, exit 132, "Index p_index = 1
        # is out of bounds (size() = 0)") on this image right after savepack
        # reaches 100% -- but the export artifact is already written to disk
        # correctly *before* the crash, every time this was observed
        # (including in this project's own CI runs). Root cause not
        # resolved: it reproduces on GitHub's real x86_64 runners but not
        # locally under podman/QEMU emulation on arm64, and isn't tied to
        # adb (a run with the adb "connection refused" noise fully
        # eliminated still crashed identically). So: check for the actual
        # artifact rather than trusting Godot's exit code, and only fail the
        # step if the artifact is genuinely missing.
        run: |
          mkdir -p ${{ matrix.out }}
          godot --headless --export-release "${{ matrix.preset }}" || true
          if [ -s "${{ matrix.check }}" ]; then
            echo "Export artifact present at ${{ matrix.check }} -- continuing despite Godot's exit code (see ADR-007)."
          else
            echo "No export artifact at ${{ matrix.check }} -- this is a real failure."
            exit 1
          fi

      - name: Export (android)
        if: matrix.name == 'android'
        run: |
          mkdir -p ${{ matrix.out }}
          godot --headless ${{ env.EXPORT_MODE }} "${{ matrix.preset }}" || true
          if [ -s "${{ matrix.check }}" ]; then
            echo "Export artifact present at ${{ matrix.check }} -- continuing despite Godot's exit code (see ADR-007)."
          else
            echo "No export artifact at ${{ matrix.check }} -- this is a real failure."
            exit 1
          fi

      - name: Zip artifact
        run: |
          cd ${{ matrix.out }}
          zip -r "../../${{ matrix.artifact }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
