name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Import & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gdformat/gdlint
        run: task deps

      # Every step below is also `task <name>` locally (see Taskfile.yml) —
      # `task ci` runs the same sequence in one shot for a pre-push check.
      - name: Import project (headless editor pass)
        run: task import

      - name: Check for parse/script errors
        run: task check

      - name: Run GdUnit4 tests
        run: task test

      - name: Check GDScript formatting
        run: task fmt:check

      - name: Lint GDScript
        run: task lint
