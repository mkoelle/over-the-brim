# Configures GitHub's auto-generated release notes (release.yml's
# `generate_release_notes: true` step). A PR lands under the FIRST
# category whose label it matches — label PRs with the most specific
# relevant category, not every label that applies.
changelog:
  categories:
    - title: Gameplay
      labels:
        - gameplay
    - title: Bug Fixes
      labels:
        - bug
    - title: Tooling & CI
      labels:
        - tooling
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
